<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Silat Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>SMART SILAT ANALYZER</h1>

        <p class="subtitle">
            Analyze Silat Match Videos from YouTube
        </p>

        <div class="input-box">
            <input 
                type="text" 
                id="youtubeLink" 
                placeholder="Paste YouTube Link Here..."
            >

            <button id="analyzeBtn">
                Analyze
            </button>
        </div>

        <div class="video-container">
            <iframe 
                id="videoFrame"
                src=""
                frameborder="0"
                allowfullscreen>
            </iframe>
        </div>

        <div class="result-box" id="resultBox">

            <h2>Match Analysis</h2>

            <div class="stats">

                <div class="card">
                    <h3>Kicks</h3>
                    <p id="kickCount">0</p>
                </div>

                <div class="card">
                    <h3>Punches</h3>
                    <p id="punchCount">0</p>
                </div>

                <div class="card">
                    <h3>Movement</h3>
                    <p id="movementLevel">Low</p>
                </div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
